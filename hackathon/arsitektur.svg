<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7382"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f8a4f"/>
    </marker>
  </defs>

  <rect width="1240" height="860" fill="#f5f6f8"/>

  <text x="48" y="52" font-size="23" font-weight="700" fill="#14171f" letter-spacing="-0.4">Arsitektur — Affiliate Studio</text>
  <text x="48" y="76" font-size="13" fill="#6b7382">Tantangan C · Agen Kreator · tiga agent, satu trust boundary, satu jejak audit</text>

  <!-- ================= SUMBER ================= -->
  <text x="48" y="118" font-size="11" font-weight="700" fill="#6b7382" letter-spacing="0.08em">SUMBER DAYA</text>

  <rect x="48" y="130" width="360" height="86" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <text x="68" y="156" font-size="14" font-weight="650" fill="#14171f">Product sheet</text>
  <text x="68" y="176" font-size="12" fill="#6b7382">Nama, harga, terjual, spesifikasi,</text>
  <text x="68" y="193" font-size="12" fill="#6b7382">deskripsi seller, varian, ongkir</text>

  <rect x="428" y="130" width="360" height="86" rx="12" fill="#eaf1ff" stroke="#c7dbff"/>
  <text x="448" y="156" font-size="14" font-weight="650" fill="#14171f">rulebook.js — 8 aturan bernomor</text>
  <text x="448" y="176" font-size="12" fill="#2563eb">Diedit manusia · tidak bisa ditulis agent</text>
  <text x="448" y="193" font-size="12" fill="#6b7382">R-01 fakta · R-02 kesehatan · R-03 halal · …</text>

  <rect x="808" y="130" width="384" height="86" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <text x="828" y="156" font-size="14" font-weight="650" fill="#14171f">Yang TIDAK diakses agent</text>
  <text x="828" y="176" font-size="12" fill="#6b7382">Akun Threads/TikTok, kredensial, data pembeli,</text>
  <text x="828" y="193" font-size="12" fill="#6b7382">berkas di luar folder studio</text>

  <!-- ================= AGENT ================= -->
  <text x="48" y="258" font-size="11" font-weight="700" fill="#6b7382" letter-spacing="0.08em">ZONA AGEN — berjalan otonom, menghasilkan usulan</text>

  <rect x="48" y="270" width="250" height="104" rx="12" fill="#ffffff" stroke="#c7dbff"/>
  <rect x="48" y="270" width="250" height="4" rx="2" fill="#2563eb"/>
  <text x="68" y="298" font-size="14" font-weight="700" fill="#2563eb">PLANNER</text>
  <text x="68" y="320" font-size="12" fill="#3d4350">Menyusun brief dari product sheet:</text>
  <text x="68" y="337" font-size="12" fill="#3d4350">sudut pesan, fakta yang boleh,</text>
  <text x="68" y="354" font-size="12" fill="#3d4350">klaim yang dilarang</text>

  <rect x="340" y="270" width="250" height="104" rx="12" fill="#ffffff" stroke="#ffd9cf"/>
  <rect x="340" y="270" width="250" height="4" rx="2" fill="#ee4d2d"/>
  <text x="360" y="298" font-size="14" font-weight="700" fill="#ee4d2d">WRITER</text>
  <text x="360" y="320" font-size="12" fill="#3d4350">Menulis draf dari brief.</text>
  <text x="360" y="337" font-size="12" fill="#3d4350">Tidak berwenang menilai.</text>
  <text x="360" y="354" font-size="12" fill="#c0392b">Tidak pernah melihat kata “lulus”</text>

  <rect x="632" y="270" width="330" height="200" rx="12" fill="#ffffff" stroke="#f3e0bd"/>
  <rect x="632" y="270" width="330" height="4" rx="2" fill="#a8630a"/>
  <text x="652" y="298" font-size="14" font-weight="700" fill="#a8630a">REVIEWER</text>
  <text x="652" y="316" font-size="11.5" fill="#6b7382">Menilai, tidak menulis</text>

  <rect x="652" y="328" width="290" height="58" rx="9" fill="#fdf3e2" stroke="#f3e0bd"/>
  <text x="668" y="349" font-size="12" font-weight="650" fill="#14171f">Lapis 1 · mesin aturan</text>
  <text x="668" y="367" font-size="11.5" fill="#6b7382">Deterministik, tidak bisa dibujuk prompt</text>
  <text x="668" y="381" font-size="11.5" fill="#6b7382">Mengutip ID aturan + bukti kutipan</text>

  <rect x="652" y="396" width="290" height="58" rx="9" fill="#ffffff" stroke="#e6e8ee"/>
  <text x="668" y="417" font-size="12" font-weight="650" fill="#14171f">Lapis 2 · LLM</text>
  <text x="668" y="435" font-size="11.5" fill="#6b7382">Menangkap klaim tersirat &amp; nada</text>
  <text x="668" y="449" font-size="11.5" fill="#6b7382">ID karangan dibuang · lapis 1 menang</text>

  <!-- panah alur -->
  <line x1="298" y1="322" x2="332" y2="322" stroke="#6b7382" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="590" y1="322" x2="624" y2="322" stroke="#6b7382" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- loop tolak -->
  <path d="M 632 484 L 465 484 L 465 378" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arRed)"/>
  <text x="486" y="450" font-size="11.5" font-weight="650" fill="#c0392b">tolak → perbaiki</text>
  <text x="486" y="466" font-size="11" fill="#c0392b">maksimal 3 iterasi, lalu berhenti</text>

  <!-- lulus -->
  <line x1="962" y1="322" x2="1006" y2="322" stroke="#0f8a4f" stroke-width="1.6" marker-end="url(#arOk)"/>
  <rect x="1010" y="300" width="182" height="44" rx="10" fill="#e8f6ee" stroke="#c3e6d2"/>
  <text x="1101" y="327" font-size="13" font-weight="700" fill="#0f8a4f" text-anchor="middle">LULUS → usulan</text>

  <!-- jejak audit -->
  <rect x="1010" y="366" width="182" height="104" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <text x="1028" y="392" font-size="13" font-weight="650" fill="#14171f">Jejak agent</text>
  <text x="1028" y="411" font-size="11.5" fill="#6b7382">Transkrip per draf:</text>
  <text x="1028" y="427" font-size="11.5" fill="#6b7382">siapa, aturan mana,</text>
  <text x="1028" y="443" font-size="11.5" fill="#6b7382">iterasi ke berapa</text>
  <text x="1028" y="461" font-size="11" fill="#c0392b">tidak bisa dihapus agent</text>

  <line x1="962" y1="400" x2="1002" y2="400" stroke="#6b7382" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- ================= TRUST BOUNDARY ================= -->
  <line x1="48" y1="520" x2="1192" y2="520" stroke="#c0392b" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="700" y="506" width="304" height="28" rx="8" fill="#fdecea" stroke="#f5c6c1"/>
  <text x="852" y="525" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">TRUST BOUNDARY — agen berhenti di sini</text>

  <!-- ================= MANUSIA ================= -->
  <text x="48" y="576" font-size="11" font-weight="700" fill="#6b7382" letter-spacing="0.08em">ZONA MANUSIA — tidak ada tindakan tanpa persetujuan</text>

  <line x1="652" y1="472" x2="652" y2="588" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arRed)"/>
  <text x="664" y="556" font-size="11" fill="#c0392b">usulan + sisa masalah</text>

  <rect x="48" y="592" width="290" height="118" rx="12" fill="#ffffff" stroke="#c3e6d2"/>
  <rect x="48" y="592" width="290" height="4" rx="2" fill="#0f8a4f"/>
  <text x="68" y="620" font-size="14" font-weight="700" fill="#0f8a4f">Gerbang persetujuan</text>
  <text x="68" y="641" font-size="12" fill="#3d4350">Tombol “Lolos” hanya bisa ditekan</text>
  <text x="68" y="658" font-size="12" fill="#3d4350">manusia. Draf yang ditolak Reviewer</text>
  <text x="68" y="675" font-size="12" fill="#3d4350">hanya bisa lolos lewat override</text>
  <text x="68" y="692" font-size="12" fill="#c0392b">+ alasan tertulis yang tersimpan</text>

  <rect x="368" y="592" width="270" height="118" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <text x="388" y="620" font-size="14" font-weight="650" fill="#14171f">Penjadwalan</text>
  <text x="388" y="641" font-size="12" fill="#3d4350">Jam puncak audiens (WIB/WITA/WIT)</text>
  <text x="388" y="658" font-size="12" fill="#3d4350">Cooldown produk 14 hari</text>
  <text x="388" y="675" font-size="12" fill="#3d4350">Satu tayangan per jendela</text>
  <text x="388" y="692" font-size="12" fill="#6b7382">Dihitung, bukan ditebak</text>

  <rect x="668" y="592" width="270" height="118" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <text x="688" y="620" font-size="14" font-weight="650" fill="#14171f">Penerbitan</text>
  <text x="688" y="641" font-size="12" fill="#3d4350">Mode manual: aplikasi membuka</text>
  <text x="688" y="658" font-size="12" fill="#3d4350">modal, manusia menekan tombol</text>
  <text x="688" y="675" font-size="12" fill="#c0392b">Tidak ada auto-post sungguhan</text>
  <text x="688" y="692" font-size="11.5" fill="#6b7382">(batasan yang kami sebut terbuka)</text>

  <line x1="338" y1="651" x2="360" y2="651" stroke="#6b7382" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="638" y1="651" x2="660" y2="651" stroke="#6b7382" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- legenda -->
  <rect x="968" y="592" width="224" height="118" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <text x="988" y="618" font-size="12" font-weight="650" fill="#14171f">Trade-off utama</text>
  <text x="988" y="639" font-size="11.5" fill="#3d4350">Aturan di berkas, bukan prompt</text>
  <text x="988" y="655" font-size="11.5" fill="#6b7382">→ bisa diaudit, tapi kurang lentur</text>
  <text x="988" y="676" font-size="11.5" fill="#3d4350">Reviewer dua lapis</text>
  <text x="988" y="692" font-size="11.5" fill="#6b7382">→ lebih lambat, lebih sulit dibobol</text>

  <text x="48" y="752" font-size="11.5" fill="#6b7382">Kotak oranye = Writer · biru = Planner · kuning = Reviewer. Garis merah putus-putus = batas kepercayaan dan jalur penolakan.</text>
  <text x="48" y="772" font-size="11.5" fill="#6b7382">Semua panah ke bawah melewati trust boundary: yang menyeberang hanya usulan, tidak pernah tindakan.</text>
</svg>
