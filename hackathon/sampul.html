<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:380px;height:216px;overflow:hidden;
font-family:"Inter","Segoe UI",system-ui,sans-serif;
background:#f5f6f8;color:#14171f}
.w{width:380px;height:216px;padding:22px 24px;box-sizing:border-box;position:relative}
.bar{position:absolute;left:0;top:0;width:380px;height:5px;
background:linear-gradient(90deg,#2563eb 0%,#ee4d2d 45%,#a8630a 78%,#0f8a4f 100%)}
.k{font-size:9.5px;font-weight:700;letter-spacing:.12em;color:#6b7382;text-transform:uppercase}
h1{font-size:27px;line-height:1.08;margin:9px 0 0;font-weight:750;letter-spacing:-.6px}
h1 span{color:#ee4d2d}
.sub{font-size:11.5px;color:#3d4350;margin-top:9px;line-height:1.4;max-width:300px}
.chips{position:absolute;left:24px;bottom:22px;display:flex;gap:6px}
.c{font-size:9px;font-weight:700;padding:4px 8px;border-radius:999px;border:1px solid}
.c1{background:#eaf1ff;border-color:#c7dbff;color:#2563eb}
.c2{background:#fff1ed;border-color:#ffd9cf;color:#ee4d2d}
.c3{background:#fdf3e2;border-color:#f3e0bd;color:#a8630a}
.c4{background:#e8f6ee;border-color:#c3e6d2;color:#0f8a4f}
.mark{position:absolute;right:20px;bottom:18px;font-size:9px;color:#6b7382;text-align:right;line-height:1.5}
</style></head><body>
<div class="w">
  <div class="bar"></div>
  <div class="k">Tencent Cloud Hackathon Indonesia 2026 · Tantangan C</div>
  <h1>Affiliate<br><span>Studio</span></h1>
  <div class="sub">Tiga agent menulis konten, menolak klaim yang melanggar, manusia memutuskan.</div>
  <div class="chips">
    <span class="c c1">Planner</span><span class="c c2">Writer</span><span class="c c3">Reviewer</span><span class="c c4">Manusia</span>
  </div>
  <div class="mark">8 aturan bernomor<br>jejak audit per draf</div>
</div>
</body></html>
