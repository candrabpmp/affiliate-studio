<!DOCTYPE html><html><head><meta charset="utf-8"><style>
/* Kanvas 1920x1080. Varian dipilih lewat ?v=1|2|3 , ukuran lewat ?w=<lebar>. */
html,body{margin:0;padding:0;background:#f5f6f8;overflow:hidden}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;color:#14171f;
  -webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#f5f6f8}

.bg{position:absolute;left:0;top:-120px;width:1920px;height:auto;display:block}
.wash{position:absolute;inset:0;background:rgba(245,246,248,.10)}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,
  #f5f6f8 0%, #f5f6f8 26%, rgba(245,246,248,.92) 30%,
  rgba(245,246,248,.34) 37%, rgba(245,246,248,.06) 42%, rgba(245,246,248,0) 45%)}
.vign{position:absolute;inset:0;box-shadow:inset 0 0 220px rgba(20,23,31,.10)}

.bar{position:absolute;left:0;top:0;width:1920px;height:10px;z-index:6;
  background:linear-gradient(90deg,#2563eb 0%,#2563eb 28%,#ee4d2d 46%,#a8630a 70%,#0f8a4f 100%)}

.wrap{position:absolute;left:104px;top:0;height:1080px;width:780px;z-index:5;
  display:flex;flex-direction:column;justify-content:center;padding:56px 0 0;box-sizing:border-box}

.k{font-size:15px;font-weight:700;letter-spacing:.19em;color:#6b7382;text-transform:uppercase}
.k+.k{margin-top:9px;color:#8b929e}
h1{font-size:124px;line-height:.94;margin:26px 0 0;font-weight:800;letter-spacing:-4.5px}
h1 .b{display:block;color:#14171f}
h1 .o{display:block;color:#ee4d2d}
.sub{font-size:29px;line-height:1.44;color:#3d4350;margin-top:34px;max-width:560px;
  font-weight:450;letter-spacing:-.2px}
.sub b{font-weight:700;color:#14171f}

.chips{display:flex;gap:12px;margin-top:46px}
.c{font-size:17px;font-weight:700;padding:11px 20px;border-radius:999px;border:1.5px solid;
  letter-spacing:.1px}
.c1{background:#eaf1ff;border-color:#c7dbff;color:#2563eb}
.c2{background:#fff1ed;border-color:#ffd9cf;color:#ee4d2d}
.c3{background:#fdf3e2;border-color:#f3e0bd;color:#a8630a}
.c4{background:#e8f6ee;border-color:#c3e6d2;color:#0f8a4f}

.foot{position:absolute;left:104px;bottom:64px;z-index:5;display:flex;align-items:center;
  gap:22px;font-size:17px;color:#6b7382}
.foot .sep{width:5px;height:5px;border-radius:50%;background:#b9bfca}
.foot b{color:#14171f;font-weight:700}

/* ---------- varian gelap ---------- */
body.dark{background:#0e1420}
.dark #stage{background:#0e1420}
.dark .wash{background:transparent}
.dark .scrim{background:linear-gradient(90deg,
  #0e1420 0%, #0e1420 24%, rgba(14,20,32,.94) 28%,
  rgba(14,20,32,.42) 35%, rgba(14,20,32,.08) 41%, rgba(14,20,32,0) 44%)}
.dark .vign{box-shadow:inset 0 0 280px rgba(0,0,0,.60)}
.dark .k{color:#8892a4}
.dark .k+.k{color:#5e6879}
.dark h1 .b{color:#f4f6fa}
.dark h1 .o{color:#ff6b4a}
.dark .sub{color:#b8c2d2}
.dark .sub b{color:#f4f6fa}
.dark .foot{color:#8892a4}
.dark .foot b{color:#e7ecf4}
.dark .foot .sep{background:#3d475a}
.dark .c1{background:rgba(79,124,255,.15);border-color:rgba(79,124,255,.42);color:#a6beff}
.dark .c2{background:rgba(255,107,74,.15);border-color:rgba(255,107,74,.42);color:#ffa892}
.dark .c3{background:rgba(224,160,58,.15);border-color:rgba(224,160,58,.42);color:#e9c07c}
.dark .c4{background:rgba(46,196,124,.15);border-color:rgba(46,196,124,.42);color:#74ddad}
</style></head><body>
<div id="stage">
  <img class="bg" id="bg" src="sampul-latar-ai.png" alt="">
  <div class="wash"></div>
  <div class="scrim"></div>
  <div class="vign"></div>
  <div class="bar"></div>

  <div class="wrap">
    <div class="k" id="k1"></div>
    <div class="k" id="k2"></div>
    <h1><span class="b">Affiliate</span><span class="o">Studio</span></h1>
    <div class="sub" id="sub"></div>
    <div class="chips">
      <span class="c c1">Planner</span>
      <span class="c c2">Writer</span>
      <span class="c c3">Reviewer</span>
      <span class="c c4">Manusia</span>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>
<script>
/* Isi tiap varian. Perbedaan yang disengaja: latar, tema terang/gelap,
   dan apakah identitas hackathon ditampilkan. */
var VARIAN = {
  1: {
    dark: true,
    bg: 'sampul-latar-ai-gelap.png',
    bgLeft: 0, bgTop: -120,
    subMax: 520,
    k1: 'Tencent Cloud Hackathon Indonesia 2026',
    k2: 'Tantangan C · Agen Kreator',
    sub: 'Tiga agent menulis konten, <b>menolak klaim yang melanggar</b>, manusia memutuskan.',
    foot: '<span><b>8</b> aturan bernomor</span><span class="sep"></span>' +
          '<span>jejak audit per draf</span><span class="sep"></span>' +
          '<span><b>20/20</b> kasus uji lulus</span>'
  },
  2: {
    dark: false,
    bg: 'sampul-latar-ai-iso.png',
    bgW: 1750, bgLeft: 170, bgTop: 0,
    subMax: 520,
    k1: 'Tencent Cloud Hackathon Indonesia 2026',
    k2: 'Tantangan C · Agen Kreator',
    sub: 'Tiga agent menulis konten, <b>menolak klaim yang melanggar</b>, manusia memutuskan.',
    foot: '<span><b>8</b> aturan bernomor</span><span class="sep"></span>' +
          '<span>jejak audit per draf</span><span class="sep"></span>' +
          '<span><b>20/20</b> kasus uji lulus</span>'
  },
  /* tanpa identitas hackathon: tidak ada Tencent, tidak ada Tantangan C,
     tidak ada angka pengujian — ini sampul produk, bukan sampul lomba. */
  3: {
    dark: false,
    bg: 'sampul-latar-ai.png',
    bgLeft: 40, bgTop: -120,
    subMax: 560,
    k1: 'Alat konten afiliasi mandiri',
    k2: 'Threads · TikTok · satu product sheet',
    sub: 'Tiga agent menulis konten, <b>menolak klaim yang melanggar</b>, manusia memutuskan.',
    foot: '<span><b>8</b> aturan bernomor</span><span class="sep"></span>' +
          '<span>jejak audit per draf</span><span class="sep"></span>' +
          '<span>manusia yang memutuskan</span>'
  }
};

(function () {
  var q = location.search;
  var v = parseInt((q.match(/[?&]v=(\d+)/) || [])[1], 10) || 3;
  var cfg = VARIAN[v] || VARIAN[3];

  if (cfg.dark) document.body.classList.add('dark');

  var bg = document.getElementById('bg');
  bg.src = cfg.bg;
  bg.style.left = cfg.bgLeft + 'px';
  bg.style.top = cfg.bgTop + 'px';
  if (cfg.bgW) bg.style.width = cfg.bgW + 'px';

  document.getElementById('k1').textContent = cfg.k1;
  document.getElementById('k2').textContent = cfg.k2;
  document.getElementById('sub').innerHTML = cfg.sub;
  document.getElementById('sub').style.maxWidth = cfg.subMax + 'px';
  document.getElementById('foot').innerHTML = cfg.foot;

  /* skala untuk ukuran lain; 1140x641 adalah 16:9 yang benar */
  var w = parseInt((q.match(/[?&]w=(\d+)/) || [])[1], 10);
  if (w && w !== 1920) {
    var s = w / 1920, st = document.getElementById('stage');
    st.style.transformOrigin = 'top left';
    st.style.transform = 'scale(' + s + ')';
    document.documentElement.style.width = w + 'px';
    document.documentElement.style.height = Math.round(1080 * s) + 'px';
  }
})();
</script>
</body></html>
